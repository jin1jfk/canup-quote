<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Canup 案件管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 使う人はPC操作や文字入力が得意でない前提。文字は大きく、押す場所は大きく、入力は選ぶだけで済む形にする */
  :root {
    --ink:#1b1f24; --sub:#4f5864; --faint:#8a929c; --line:#d3d9e0; --soft:#f2f4f7; --bg:#ffffff;
    --navy:#1F3864; --navy-soft:#e6ebf3; --err:#a3261e; --ok:#1d6b3a;
    --over:#9C1C1C; --d7:#F8C9A0; --d14:#FFF2B3; --done:#D5EDDA;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--soft); color:var(--ink); }
  body { font:17px/1.6 "Noto Sans JP","Hiragino Sans",sans-serif; -webkit-text-size-adjust:100%; }
  button { font:inherit; color:inherit; cursor:pointer; }
  header.bar { background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header.bar h1 { font-size:19px; margin:0; letter-spacing:.02em; }
  header.bar .who { color:var(--sub); font-size:14px; }
  header.bar .right { margin-left:auto; display:flex; gap:14px; align-items:center; }
  /* 社内用の一覧(閲覧用スプレッドシート)を開くボタン */
  .viewbtn { display:inline-flex; flex-direction:column; align-items:center; border:2px solid var(--navy); border-radius:6px; padding:6px 14px; color:var(--navy); font-weight:700; font-size:15px; text-decoration:none; background:#fff; line-height:1.3; }
  .viewbtn small { font-size:11px; font-weight:400; color:var(--sub); }
  .viewbtn:hover { background:var(--navy-soft); }
  .viewbtn[hidden] { display:none; }
  main { max-width:900px; margin:0 auto; padding:16px 16px 120px; }

  .panel { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:18px; margin-bottom:16px; }
  .panel h2 { font-size:17px; margin:0 0 8px; color:var(--navy); }
  input, textarea { width:100%; font:inherit; font-size:18px; padding:12px 14px; border:1px solid #b9c1cb; border-radius:6px; background:#fff; color:var(--ink); }
  input:focus, textarea:focus { outline:3px solid var(--navy); outline-offset:-1px; }
  textarea { min-height:110px; resize:vertical; }
  .msg { font-size:16px; min-height:1.6em; }
  .msg.err { color:var(--err); font-weight:500; }
  .msg.ok { color:var(--ok); font-weight:500; }
  .hint { font-size:14px; color:var(--sub); margin:6px 0 0; }
  #setup { display:none; }
  #setup.show { display:block; }

  /* 大きいボタン */
  .btn { border:1px solid #b9c1cb; background:#fff; border-radius:6px; padding:12px 18px; font-size:17px; min-height:50px; }
  .btn.main { background:var(--navy); border-color:var(--navy); color:#fff; font-weight:700; letter-spacing:.04em; }
  .btn.main:disabled { opacity:.45; cursor:default; }
  .btn.wide { width:100%; }

  /* 上の要約 */
  .due { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:12px 16px; margin-bottom:12px; font-size:16px; }
  .due .none { color:var(--sub); }
  .due .it { display:inline-flex; align-items:center; gap:8px; margin-right:18px; }
  .due b { font-size:22px; font-variant-numeric:tabular-nums; }
  .due .mk { width:14px; height:14px; border-radius:3px; display:inline-block; }

  /* 絞り込みタブ */
  .tabs { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-bottom:10px; }
  .tabs button { border:1px solid var(--line); background:#fff; border-radius:6px; padding:10px 4px; font-size:16px; color:var(--sub); min-height:50px; }
  .tabs button.on { background:var(--navy); border-color:var(--navy); color:#fff; font-weight:700; }
  .tabs .n { display:block; font-size:13px; font-weight:400; opacity:.85; font-variant-numeric:tabular-nums; }
  .search { margin-bottom:12px; }

  /* 一覧 */
  .list { display:grid; gap:10px; }
  .card { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:14px 16px; }
  .card.lost, .card.paid { background:#f7f8fa; }
  .card.paid .nm, .card.paid .amt { color:var(--sub); font-weight:500; }
  .card .top { display:flex; gap:12px; align-items:flex-start; cursor:pointer; }
  .card .nm { font-weight:700; font-size:18px; flex:1; line-height:1.45; }
  .card.lost .nm { color:var(--faint); font-weight:500; }
  .card .amt { font-variant-numeric:tabular-nums; font-weight:700; font-size:18px; white-space:nowrap; }
  .card.lost .amt { color:var(--faint); font-weight:400; }
  .card .sub { font-size:15px; color:var(--sub); margin-top:4px; display:flex; flex-wrap:wrap; gap:2px 16px; }
  .card .st { font-weight:700; color:var(--ink); }
  .card.lost .st { color:var(--faint); }
  .card .act { display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .card .act .edit { margin-left:auto; }
  .chip { display:inline-block; font-size:15px; padding:3px 10px; border-radius:4px; white-space:nowrap; font-weight:500; }
  .chip.over { background:var(--over); color:#fff; }
  .chip.d7 { background:var(--d7); }
  .chip.d14 { background:var(--d14); }
  .chip.done { background:var(--done); }
  .pay { background:#fff; border:2px solid var(--ok); color:var(--ok); font-weight:700; }
  .confirm { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-weight:500; }
  .empty { padding:36px 16px; text-align:center; color:var(--sub); background:var(--bg); border:1px solid var(--line); border-radius:6px; }

  .fab { position:fixed; left:0; right:0; bottom:0; background:rgba(242,244,247,.96); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); z-index:5; }
  .fab .in { max-width:900px; margin:0 auto; }

  /* 入力画面 */
  .editor { position:fixed; inset:0; background:rgba(27,31,36,.4); display:none; z-index:10; }
  .editor.show { display:block; }
  .sheet { position:absolute; top:0; right:0; bottom:0; width:min(600px, 100%); background:#fff; display:flex; flex-direction:column; }
  .sheet .hd { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  .sheet .hd h2 { font-size:19px; margin:0; flex:1; }
  .sheet .bd { padding:6px 16px 24px; overflow:auto; flex:1; }
  .sheet .ft { padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  .sheet .ft .msg { margin-bottom:8px; }
  .q { margin-top:22px; }
  .q > .lb { font-size:16px; font-weight:700; margin-bottom:8px; display:flex; gap:8px; align-items:baseline; }
  .q > .lb small { font-weight:400; color:var(--sub); font-size:14px; }
  .tag { font-size:12px; color:var(--sub); border:1px solid var(--line); padding:0 6px; border-radius:3px; font-weight:400; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; }
  .opts button { border:1px solid #b9c1cb; background:#fff; border-radius:6px; padding:10px 16px; font-size:17px; min-height:50px; min-width:72px; }
  .opts button.on { background:var(--navy); border-color:var(--navy); color:#fff; font-weight:700; }
  .opts.small button { font-size:15px; min-height:44px; padding:8px 12px; }
  .datev { font-size:18px; font-weight:700; margin:0 0 8px; min-height:1.5em; }
  .datev.none { color:var(--faint); font-weight:400; }
  .money { display:flex; align-items:center; gap:8px; }
  .money span { font-size:18px; }
  .money input { font-variant-numeric:tabular-nums; text-align:right; }
  .ro { padding:10px 14px; background:var(--soft); border-radius:6px; color:var(--sub); font-variant-numeric:tabular-nums; }
  .toggle { display:flex; align-items:center; gap:12px; padding:14px; border:1px solid #b9c1cb; border-radius:6px; background:#fff; width:100%; text-align:left; font-size:17px; min-height:56px; }
  .toggle .box { width:28px; height:28px; border:2px solid var(--sub); border-radius:4px; display:inline-flex; align-items:center; justify-content:center; font-weight:700; flex:none; }
  .toggle.on { border-color:var(--ok); background:#f2faf4; }
  .toggle.on .box { background:var(--ok); border-color:var(--ok); color:#fff; }
  .more { background:none; border:0; color:var(--navy); text-decoration:underline; padding:10px 0; font-size:16px; }
  .preview { margin-top:8px; font-size:15px; color:var(--sub); }
  .preview b { color:var(--ink); }

  @media (max-width:520px) {
    .tabs button { font-size:15px; }
    header.bar h1 { font-size:17px; }
  }
  /* 見積書と案件管理の行き来(両方のページで同じ見た目) */
  nav.apps { display:grid; grid-template-columns:1fr 1fr; background:#1F3864; }
  nav.apps a { display:block; text-align:center; padding:12px 8px; color:#c9d3e3; text-decoration:none; font-size:16px; font-weight:500; border-bottom:4px solid transparent; }
  nav.apps a.on { color:#fff; font-weight:700; border-bottom-color:#fff; }
  nav.apps a:not(.on):hover { color:#fff; }
</style>
</head>
<body>
<nav class="apps"><a href="./">見積書・請求書</a><a href="anken.html" class="on" aria-current="page">案件管理</a></nav>
<header class="bar">
  <h1>Canup 案件管理</h1>
  <span class="who" id="who">未接続</span>
  <span class="right">
    <a id="viewLink" class="viewbtn" href="#" target="_blank" rel="noopener" hidden>社内用の一覧を開く<small>スプレッドシート・見るだけ</small></a>
  </span>
</header>

<main>
  <section class="panel" id="setup">
    <h2>つながりませんでした</h2>
    <p class="hint" style="margin:0 0 10px">中村さんから届いたリンクを開くと、ここは自動で済みます。手で入れる場合は、合言葉を貼り付けて「つなぐ」を押してください。</p>
    <input id="apiKey" autocomplete="off" placeholder="合言葉">
    <button class="btn main wide" type="button" style="margin-top:12px" onclick="saveSetup()">つなぐ</button>
    <details style="margin-top:12px"><summary class="hint">接続先URLを変える(通常は不要)</summary>
      <input id="apiUrl" style="margin-top:8px" placeholder="https://script.google.com/.../exec" autocomplete="off">
    </details>
    <div class="msg" id="setupMsg"></div>
  </section>

  <div class="due" id="due" hidden></div>
  <div class="tabs" id="tabs"></div>
  <div class="search"><input id="q" type="search" placeholder="名前で探す" autocomplete="off"></div>
  <div class="msg" id="msg" style="margin-bottom:8px"></div>
  <div class="list" id="list"><div class="empty">読み込み中です。少しお待ちください。</div></div>
</main>

<div class="fab"><div class="in"><button class="btn main wide" type="button" id="addBtn" onclick="openEditor(null)" disabled>＋ 新しい案件を入れる</button></div></div>

<div class="editor" id="editor">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edTitle">
    <div class="hd"><h2 id="edTitle">案件</h2><button class="btn" type="button" onclick="closeEditor()">もどる</button></div>
    <div class="bd" id="edBody"></div>
    <div class="ft"><div class="msg" id="edMsg"></div><button class="btn main wide" type="button" id="saveBtn" onclick="save()">保存する</button></div>
  </div>
</div>

<script>
// 接続先は見積書アプリと同じ Apps Script。合言葉は担当者用と管理者用の2種類で、担当者用では公開する列だけが届く
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbyuCVj4OsMXzrhF6AFxGG8uQGFj887OGhWDpVW3EY_5_b2gUiDmhtoX-dPo_h-rneO1/exec';
// 合言葉は見積書の画面と同じ場所に保存する(どちらかで1回つなげば両方使える)
const LS = { url:'canupQuote.apiUrl', key:'canupQuote.apiKey', oldKey:'canupAnken.apiKey', filter:'canupAnken.filter2' };
const ALERTS = { '期限超過・未確認':'over', '7日以内':'d7', '14日以内':'d14', '確認済':'done' };
const ALERT_ORDER = { over:0, d7:1, d14:2 };
const TABS = [['todo', '要対応'], ['受注', '受注'], ['提案中', '提案中'], ['all', 'すべて']];
// 画面で専用の入れ方をする列(それ以外の列は型に合わせた汎用の入れ方)
const SPECIAL = ['No', '物件名', '支払アラート', '備考'];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lsGet(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function lsSet(k,v){ try { localStorage.setItem(k, v); } catch(e){} }
const yen = n => n === '' || n == null || isNaN(Number(n)) ? '' : '¥' + Number(n).toLocaleString('ja-JP');
const jDate = s => { if (!s) return ''; const p = String(s).split('-'); if (p.length !== 3) return String(s); const d = new Date(+p[0], p[1] - 1, +p[2]); return Number(p[1]) + '月' + Number(p[2]) + '日(' + '日月火水木金土'[d.getDay()] + ')'; };
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const digits = s => String(s || '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^\d]/g, '');

let data = { fields:[], rows:[], role:'' };
let tab = lsGet(LS.filter) || 'todo';
let editing = null;  // { row, name, v:{...} } 新規は row:null
let busy = false;
let confirmRow = 0;  // 「入金を確認」を押して確認待ちの行

// ---------- 最初の接続: リンクの #k=合言葉 を受け取って保存し、アドレス欄から消す ----------
(function takeKeyFromLink() {
  const m = location.hash.match(/[#&]k=([^&]+)/);
  if (!m) return;
  lsSet(LS.key, decodeURIComponent(m[1]));
  history.replaceState(null, '', location.pathname + location.search);
})();

// ---------- 通信 ----------
function apiKey() { return lsGet(LS.key) || lsGet(LS.oldKey); }
async function api(action, payload) {
  const url = lsGet(LS.url) || DEFAULT_API_URL;
  if (!apiKey()) throw new Error('まだつながっていません。中村さんから届いたリンクを開き直してください。');
  let res;
  try {
    res = await fetch(url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ key: apiKey(), action }, payload || {})) });
  } catch (e) {
    throw new Error('インターネットにつながりませんでした。電波かWi-Fiを確かめて、画面を開き直してください。');
  }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('スプレッドシートから想定外の返事がありました(HTTP ' + res.status + ')。中村さんに連絡してください。'); }
  if (!j.ok) throw new Error(j.error || '原因のわからないエラーです。中村さんに連絡してください。');
  return j;
}

async function load() {
  $('who').textContent = '読み込み中';
  try {
    apply(await api('ankenList'));
    setMsg('msg', '');
    $('setup').classList.remove('show');
  } catch (e) {
    $('who').textContent = '未接続';
    $('list').innerHTML = '<div class="empty">一覧を読み込めませんでした。</div>';
    setMsg('msg', e.message, 'err');
    // つながらないときだけ入力欄を出す(ふだんはリンクを開くだけでつながるので、ボタンは置かない)
    if (!apiKey() || /合言葉/.test(e.message)) $('setup').classList.add('show');
  }
}

function apply(j) {
  data = j;
  $('who').textContent = j.role === 'admin' ? '管理者' : '';
  $('addBtn').disabled = false;
  const v = $('viewLink');
  if (j.viewUrl) { v.href = j.viewUrl; v.hidden = false; } else v.hidden = true;
  draw();
}

// ---------- 一覧 ----------
const F = name => data.fields.find(f => f.name === name);
const alertCls = r => ALERTS[r.v['支払アラート']] || '';
const needsPay = r => r.v['受注状況'] === '受注' && F('支払確認') && r.v['支払確認'] !== true;
const isTodo = r => ['over', 'd7', 'd14'].indexOf(alertCls(r)) >= 0 || needsPay(r);

function draw() {
  const count = k => data.rows.filter(r => inTab(r, k)).length;
  $('tabs').innerHTML = TABS.map(t => '<button type="button" class="' + (t[0] === tab ? 'on' : '') + '" data-t="' + t[0] + '">' + t[1] + '<span class="n">' + count(t[0]) + '件</span></button>').join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.t; lsSet(LS.filter, tab); confirmRow = 0; draw(); window.scrollTo(0, 0); });

  const n = k => data.rows.filter(r => alertCls(r) === k).length;
  const items = [['over', '入金予定日を過ぎた'], ['d7', '入金予定まで7日以内'], ['d14', '14日以内']].filter(a => n(a[0]));
  $('due').hidden = !F('支払アラート');
  $('due').innerHTML = items.length
    ? items.map(a => '<span class="it"><span class="mk" style="background:var(--' + a[0] + ')"></span>' + a[1] + ' <b>' + n(a[0]) + '</b>件</span>').join('')
    : '<span class="none">入金の遅れはありません</span>';

  const q = $('q').value.trim();
  const rows = data.rows.filter(r => inTab(r, tab) && (!q || String(r.v['物件名']).indexOf(q) >= 0 || String(r.v['備考'] || '').indexOf(q) >= 0));
  // 並び: 対応中 → 入金済み → 失注。対応中の中は遅れている順 → 入金予定日の近い順 → 番号
  const grp = r => r.v['受注状況'] === '失注' ? 2 : r.v['支払確認'] === true ? 1 : 0;
  rows.sort((a, b) => {
    if (grp(a) !== grp(b)) return grp(a) - grp(b);
    const x = ALERT_ORDER[alertCls(a)] ?? 9, y = ALERT_ORDER[alertCls(b)] ?? 9;
    if (x !== y) return x - y;
    const da = a.v['支払い予定日'] || '9999', db = b.v['支払い予定日'] || '9999';
    if (da !== db) return da < db ? -1 : 1;
    return (Number(a.v['No']) || a.row) - (Number(b.v['No']) || b.row);
  });
  if (!data.rows.length) { $('list').innerHTML = '<div class="empty">まだ案件がありません。下の「新しい案件を入れる」から入れてください。</div>'; return; }
  if (!rows.length) {
    $('list').innerHTML = '<div class="empty">' + (tab === 'todo' && !q ? '今やることはありません。' : 'ここに出る案件はありません。') + '</div>';
    return;
  }
  const money = F('売上') ? '売上' : (data.fields.find(f => f.type === 'money') || {}).name;
  $('list').innerHTML = rows.map(r => {
    const st = r.v['受注状況'] || '';
    const al = alertCls(r);
    const sub = [
      st ? '<span class="st">' + esc(st) + '</span>' : '',
      r.v['支払い予定日'] ? '<span>入金予定 ' + esc(jDate(r.v['支払い予定日'])) + '</span>' : '',
      r.v['支払方法'] ? '<span>' + esc(r.v['支払方法']) + '</span>' : '',
    ].join('');
    let act = '';
    if (confirmRow === r.row) {
      act = '<div class="confirm">入金を確認しましたか？ <button class="btn main" type="button" data-yes="' + r.row + '">はい</button><button class="btn" type="button" data-no="1">やめる</button></div>';
    } else {
      if (al && al !== 'done') act += '<span class="chip ' + al + '">' + esc(r.v['支払アラート']) + '</span>';
      if (needsPay(r)) act += '<button class="btn pay" type="button" data-pay="' + r.row + '">入金を確認</button>';
      else if (r.v['支払確認'] === true) act += '<span class="chip done">入金確認済み</span>';
    }
    act += '<button class="btn edit" type="button" data-edit="' + r.row + '">直す</button>';
    return '<div class="card' + (st === '失注' ? ' lost' : r.v['支払確認'] === true ? ' paid' : '') + '">' +
      '<div class="top" data-edit="' + r.row + '"><div class="nm">' + esc(r.v['物件名']) + '</div><div class="amt">' + (money ? esc(yen(r.v[money])) : '') + '</div></div>' +
      '<div class="sub">' + sub + '</div>' +
      '<div class="act">' + act + '</div></div>';
  }).join('');
  const rec = row => data.rows.find(r => r.row === Number(row));
  $('list').querySelectorAll('[data-edit]').forEach(e => e.onclick = () => openEditor(rec(e.dataset.edit)));
  $('list').querySelectorAll('[data-pay]').forEach(e => e.onclick = () => { confirmRow = Number(e.dataset.pay); draw(); });
  $('list').querySelectorAll('[data-no]').forEach(e => e.onclick = () => { confirmRow = 0; draw(); });
  $('list').querySelectorAll('[data-yes]').forEach(e => e.onclick = () => markPaid(rec(e.dataset.yes)));
}

function inTab(r, k) {
  if (k === 'todo') return isTodo(r);
  if (k === 'all') return true;
  return r.v['受注状況'] === k;
}

// 一覧から入金確認(2回押し)。受注状況はそのまま送る
async function markPaid(r) {
  if (busy || !r) return;
  busy = true;
  setMsg('msg', '保存しています...');
  try {
    const j = await api('ankenSave', { row: r.row, name: r.v['物件名'], values: { '受注状況': r.v['受注状況'], '支払確認': true } });
    confirmRow = 0;
    apply(j);
    setMsg('msg', '「' + r.v['物件名'] + '」を入金確認済みにしました。', 'ok');
  } catch (e) {
    setMsg('msg', e.message, 'err');
  }
  busy = false;
}

// ---------- 入力画面 ----------
// 物件名は「会社名(商品)」の形。会社名は過去の名前から選べ、商品はボタンで選ぶ
function splitName(s) {
  const m = String(s || '').match(/^(.*?)[(（]([^()（）]*)[)）]\s*$/);
  return m ? { co: m[1].trim(), item: m[2].trim() } : { co: String(s || '').trim(), item: '' };
}
function knownCompanies() {
  const set = new Set();
  data.rows.forEach(r => { const c = splitName(r.v['物件名']).co; if (c) set.add(c); });
  return [...set].sort((a, b) => a.localeCompare(b, 'ja'));
}
function knownItems() {
  const cnt = {};
  data.rows.forEach(r => { const it = splitName(r.v['物件名']).item.split(/[\s　]/)[0]; if (it) cnt[it] = (cnt[it] || 0) + 1; });
  return Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).slice(0, 10);
}

function openEditor(rec) {
  const v = rec ? Object.assign({}, rec.v) : {};
  if (!rec) {
    const st = F('受注状況'), tn = F('担当者'), pm = F('支払方法');
    if (st && st.options && st.options.indexOf('提案中') >= 0) v['受注状況'] = '提案中';
    if (tn && tn.options && tn.options.length === 1) v['担当者'] = tn.options[0];
    if (pm && pm.options && pm.options.length) v['支払方法'] = pm.options[0];
  }
  editing = { row: rec ? rec.row : null, name: rec ? rec.v['物件名'] : '', v };
  $('edTitle').textContent = rec ? '案件を直す' : '新しい案件';
  const nm = splitName(v['物件名']);
  const isAdmin = data.role === 'admin';
  const tagOf = f => isAdmin && !f.public ? ' <span class="tag">社内に非公開</span>' : '';
  const h = [];

  // 1. お客様
  h.push('<div class="q"><div class="lb">お客様・会社名</div>' +
    '<input id="e_co" list="coList" value="' + esc(nm.co) + '" placeholder="文字を1つ入れると候補が出ます" autocomplete="off">' +
    '<datalist id="coList">' + knownCompanies().map(c => '<option value="' + esc(c) + '">').join('') + '</datalist></div>');
  // 2. 商品
  const items = knownItems();
  if (nm.item && items.indexOf(nm.item) < 0) items.unshift(nm.item);
  h.push('<div class="q"><div class="lb">何の案件か</div><div class="opts" id="e_items">' +
    items.map(x => '<button type="button" data-v="' + esc(x) + '" class="' + (x === nm.item ? 'on' : '') + '">' + esc(x) + '</button>').join('') +
    '<button type="button" data-other="1">＋ 新しく入力</button></div>' +
    '<input id="e_item" style="margin-top:8px" value="' + esc(nm.item) + '" placeholder="例: 内装工事(次からはボタンに出ます)" hidden>' +
    '<div class="preview" id="e_prev"></div></div>');

  // 3以降: 列ごと(物件名・No・アラート・備考は別扱い)。考える順(状況→金額→入金)に並べ、知らない列はシートの順で後ろへ
  orderedFields().forEach(f => {
    if (SPECIAL.indexOf(f.name) >= 0) return;
    const val = v[f.name];
    const id = 'e_f' + data.fields.indexOf(f);
    if (f.type === 'auto') {
      if (!rec && f.name !== '業務委託料') return;
      h.push('<div class="q" data-f="' + esc(f.name) + '"><div class="lb">' + esc(f.name) + ' <small>自動で計算</small>' + tagOf(f) + '</div><div class="ro" id="' + id + '">' + esc(typeof val === 'number' ? yen(val) : (val || '-')) + '</div></div>');
    } else if (f.type === 'check') {
      h.push('<div class="q" data-f="' + esc(f.name) + '" id="wrap_check"><div class="lb">入金' + tagOf(f) + '</div>' +
        '<button type="button" class="toggle' + (val === true ? ' on' : '') + '" id="' + id + '" data-on="' + (val === true ? 1 : 0) + '"><span class="box">' + (val === true ? '✓' : '') + '</span><span>入金を確認した</span></button></div>');
    } else if (f.type === 'select') {
      const o = (f.options || []).slice();
      if (val && o.indexOf(val) < 0) o.push(val);
      h.push('<div class="q" data-f="' + esc(f.name) + '"><div class="lb">' + esc(label(f.name)) + tagOf(f) + '</div><div class="opts" id="' + id + '">' +
        o.map(x => '<button type="button" data-v="' + esc(x) + '" class="' + (x === val ? 'on' : '') + '">' + esc(short(x)) + '</button>').join('') + '</div></div>');
    } else if (f.type === 'date') {
      h.push('<div class="q" data-f="' + esc(f.name) + '"><div class="lb">' + esc(label(f.name)) + tagOf(f) + '</div>' +
        '<div class="datev" id="' + id + '_v"></div>' +
        '<div class="opts small" id="' + id + '_q">' + quickDates().map(d => '<button type="button" data-d="' + d[1] + '">' + d[0] + '</button>').join('') +
        '<button type="button" data-cal="1">カレンダー</button></div>' +
        '<input type="date" id="' + id + '" value="' + esc(val || '') + '" style="margin-top:8px" hidden></div>');
    } else if (f.type === 'money') {
      h.push('<div class="q" data-f="' + esc(f.name) + '"><div class="lb">' + esc(label(f.name)) + tagOf(f) + '</div>' +
        '<div class="money"><span>¥</span><input type="text" inputmode="numeric" id="' + id + '" value="' + esc(val === '' || val == null ? '' : Number(val).toLocaleString('ja-JP')) + '" placeholder="0"></div></div>');
    } else {
      h.push('<div class="q" data-f="' + esc(f.name) + '"><div class="lb">' + esc(f.name) + tagOf(f) + '</div><input id="' + id + '" value="' + esc(val || '') + '"></div>');
    }
  });
  // 最後: メモ(畳んでおく)
  const note = F('備考');
  if (note) {
    const has = !!String(v['備考'] || '').trim();
    h.push('<div class="q"><button type="button" class="more" id="e_noteBtn"' + (has ? ' hidden' : '') + '>メモを書く(なくてもよい)</button>' +
      '<div id="e_noteWrap"' + (has ? '' : ' hidden') + '><div class="lb">メモ' + tagOf(note) + '</div><textarea id="e_note">' + esc(v['備考'] || '') + '</textarea></div></div>');
  }
  $('edBody').innerHTML = h.join('');
  wireEditor();
  setMsg('edMsg', '');
  $('saveBtn').disabled = false;
  $('editor').classList.add('show');
  $('edBody').scrollTop = 0;
}

// 見出しを話し言葉に寄せる(列名そのものはシートと同じ)
function label(n) { return ({ '受注状況':'状況', '支払い予定日':'入金予定日', '支払方法':'支払い方法', '売上':'金額(売上)' })[n] || n; }
function short(x) { return x === 'その他(備考に記入)' ? 'その他' : x; }
function quickDates() {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const endM = new Date(t.getFullYear(), t.getMonth() + 1, 0);
  const next15 = new Date(t.getFullYear(), t.getMonth() + 1, 15);
  const endN = new Date(t.getFullYear(), t.getMonth() + 2, 0);
  return [['今日', ymd(t)], ['今月末', ymd(endM)], ['来月15日', ymd(next15)], ['来月末', ymd(endN)], ['未定', '']];
}

const ORDER = ['受注状況', '売上', '手数料(Canup)', '業務委託料', '支払い予定日', '支払方法', '支払確認', '担当者'];
function orderedFields() {
  const rank = f => { const i = ORDER.indexOf(f.name); return i >= 0 ? i : ORDER.length + data.fields.indexOf(f); };
  return data.fields.slice().sort((a, b) => rank(a) - rank(b));
}

function el(name) { const i = data.fields.findIndex(f => f.name === name); return i >= 0 ? $('e_f' + i) : null; }

function wireEditor() {
  // 商品ボタン
  const itemBox = $('e_items'), itemIn = $('e_item');
  itemBox.querySelectorAll('button').forEach(b => b.onclick = () => {
    itemBox.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    if (b.dataset.other) { itemIn.hidden = false; itemIn.value = ''; itemIn.focus(); }
    else { itemIn.hidden = true; itemIn.value = b.dataset.v; }
    preview();
  });
  itemIn.addEventListener('input', preview);
  $('e_co').addEventListener('input', preview);
  preview();

  data.fields.forEach(f => {
    const e = el(f.name);
    if (!e || f.type === 'auto') return;
    if (f.type === 'select') {
      e.querySelectorAll('button').forEach(b => b.onclick = () => {
        const on = b.classList.contains('on');
        e.querySelectorAll('button').forEach(x => x.classList.remove('on'));
        if (!on || f.name === '受注状況') b.classList.add('on');
        if (f.name === '受注状況') syncCheck();
      });
    } else if (f.type === 'check') {
      e.onclick = () => { const on = e.dataset.on !== '1'; e.dataset.on = on ? '1' : '0'; e.classList.toggle('on', on); e.querySelector('.box').textContent = on ? '✓' : ''; };
    } else if (f.type === 'date') {
      const show = () => { const t = $(e.id + '_v'); t.textContent = e.value ? jDate(e.value) : '未定(あとで入れる)'; t.className = 'datev' + (e.value ? '' : ' none'); };
      $(e.id + '_q').querySelectorAll('button').forEach(b => b.onclick = () => {
        if (b.dataset.cal) { e.hidden = false; try { e.showPicker(); } catch (x) { e.focus(); } return; }
        e.value = b.dataset.d; show();
      });
      e.addEventListener('change', show);
      show();
    } else if (f.type === 'money') {
      e.addEventListener('input', () => { const n = digits(e.value); e.value = n ? Number(n).toLocaleString('ja-JP') : ''; calcFee(); });
    }
  });
  calcFee();
  syncCheck();
  const nb = $('e_noteBtn');
  if (nb) nb.onclick = () => { nb.hidden = true; $('e_noteWrap').hidden = false; $('e_note').focus(); };
}

function composeName() {
  const co = $('e_co').value.trim(), it = $('e_item').value.trim();
  return co && it ? co + '(' + it + ')' : co || it;
}
function preview() { const n = composeName(); $('e_prev').innerHTML = n ? '一覧では <b>' + esc(n) + '</b> と出ます' : ''; }

// 業務委託料 = 売上 - 手数料 をその場で見せる(実際の値はシートの数式が出す)
function calcFee() {
  const out = el('業務委託料'), s = el('売上'), c = el('手数料(Canup)');
  if (!out || !s || !c) return;
  const a = Number(digits(s.value)), b = Number(digits(c.value));
  out.textContent = s.value || c.value ? yen(a - b) : '-';
}

// 入金のチェックは「受注」のときだけ出す(シートと同じ決まり)
function syncCheck() {
  const w = $('wrap_check'), st = el('受注状況');
  if (!w || !st) return;
  const on = st.querySelector('button.on');
  w.hidden = !on || on.dataset.v !== '受注';
}

function closeEditor() {
  if (busy) return;
  $('editor').classList.remove('show');
  editing = null;
}

async function save() {
  if (busy || !editing) return;
  const name = composeName();
  if (!$('e_co').value.trim()) { setMsg('edMsg', 'お客様・会社名を入れてください。', 'err'); $('e_co').focus(); return; }
  const values = { '物件名': name };
  data.fields.forEach(f => {
    if (SPECIAL.indexOf(f.name) >= 0 || f.type === 'auto') return;
    const e = el(f.name);
    if (!e) return;
    if (f.type === 'check') { if (!$('wrap_check').hidden) values[f.name] = e.dataset.on === '1'; return; }
    if (f.type === 'select') { const on = e.querySelector('button.on'); values[f.name] = on ? on.dataset.v : ''; return; }
    if (f.type === 'money') { values[f.name] = digits(e.value); return; }
    values[f.name] = e.value.trim();
  });
  if ($('e_note')) values['備考'] = $('e_note').value.trim();
  busy = true; $('saveBtn').disabled = true; setMsg('edMsg', '保存しています...');
  try {
    const j = await api('ankenSave', { row: editing.row, name: editing.name, values });
    apply(j);
    busy = false;
    closeEditor();
    setMsg('msg', j.viewErr ? '保存しました。ただし社内用の一覧への反映に失敗しました。次に開いたときにもう一度反映します。' : '「' + name + '」を保存しました。', j.viewErr ? 'err' : 'ok');
    window.scrollTo(0, 0);
  } catch (e) {
    busy = false; $('saveBtn').disabled = false;
    setMsg('edMsg', e.message, 'err');
  }
}

// ---------- その他 ----------
function setMsg(id, text, cls) { const e = $(id); e.textContent = text || ''; e.className = 'msg' + (cls ? ' ' + cls : ''); }
function saveSetup() {
  const k = $('apiKey').value.trim(), u = $('apiUrl').value.trim();
  if (!k && !apiKey()) { setMsg('setupMsg', '合言葉を貼り付けてください。', 'err'); return; }
  if (u && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) { setMsg('setupMsg', 'URLは https://script.google.com/ で始まり /exec で終わるものです。わからなければ空のままにしてください。', 'err'); return; }
  if (k) lsSet(LS.key, k);
  lsSet(LS.url, u);
  $('setup').classList.remove('show');
  setMsg('setupMsg', '');
  load();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('editor').classList.contains('show')) closeEditor(); });
$('q').addEventListener('input', draw);
load();
</script>
